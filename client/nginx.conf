server {
    listen 80;
    root /usr/share/nginx/html;

    # Les appels du front vers /api sont relayés au service "server" (DNS Docker)
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA : toutes les routes React renvoient index.html
    location / {
        try_files $uri /index.html;
    }
}
