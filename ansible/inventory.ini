# Les "machines" sont les conteneurs DinD lancés par swarm/compose.yml (projet "swarm").
# Pour un nouveau noeud : docker compose up -d --scale node=4, puis ajouter swarm-node-4 ici.
[managers]
swarm-manager-1

[workers]
swarm-node-1
swarm-node-2
swarm-node-3

[all:vars]
# Connexion via "docker exec" (pas de SSH) ; sur de vraies VMs : ansible_connection=ssh,
# ansible_host=<IP>, ansible_user=<user>, ansible_become=true (sudo) et une clé SSH (voir README)
ansible_connection=community.docker.docker
ansible_python_interpreter=/usr/bin/python3
# Adresse du manager vue par les workers (nom DNS du service compose)
swarm_manager_addr=manager
