# Cluster Docker Swarm simulé en local : chaque conteneur DinD joue le rôle d'une machine.
# docker compose up -d --build --scale node=3 --wait   → 1 manager + 3 noeuds
# puis ../ansible.sh pour initialiser le cluster Swarm
x-dind: &dind
  build: .
  privileged: true # nécessaire pour faire tourner un daemon Docker dans le conteneur (local uniquement !)
  healthcheck:
    test: ["CMD", "docker", "info"] # le daemon interne répond
    interval: 3s
    retries: 20

services:
  manager:
    <<: *dind
    hostname: manager
    ports:
      - 80:80 # Traefik (TP4) : point d'entrée HTTP du cluster depuis la machine hôte
    volumes:
      - /home/manager # volume anonyme : les stacks copiées ici survivent à un redémarrage

  node:
    <<: *dind
