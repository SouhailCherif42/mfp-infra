# Même stack que compose.yml, mais avec les images publiées par la CI sur GHCR (aucun build local)
# docker compose -f compose.prod.yml up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: supersecret
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    image: ghcr.io/souhailcherif42/mfp-server:latest
    environment:
      DB_HOST: db
      DB_PASSWORD: supersecret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/users/me').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  client:
    image: ghcr.io/souhailcherif42/mfp-client:latest
    ports:
      - 8080:80
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
